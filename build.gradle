// Hex Casting — Reborn by Magetka
// Unofficial NeoForge 1.21.1 port of Hex Casting (c) gamma-delta / petrak@ and contributors, MIT.
// Single-project NeoForge build using ModDevGradle (replaces the upstream Architectury multi-loader setup).

import at.petrak.hexcasting.build.Json5Filter

plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
    id 'net.neoforged.moddev'
}

group = project.modGroup
version = "${project.modVersion}"

base {
    archivesName = "${project.jarBaseName}-${project.minecraftVersion}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
}

// Upstream keeps Kotlin and Java sources side by side in src/main/java.
sourceSets {
    main {
        kotlin.srcDirs += 'src/main/java'
        resources {
            srcDir 'src/generated/resources'
            exclude '**/.cache'
            exclude '**/*.bbmodel'
        }
    }
    test {
        kotlin.srcDirs += 'src/test/java'
    }
    // In-game GameTests (dev runs only, not packaged into the release jar).
    gametest {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
}

repositories {
    mavenCentral()
    // PAUCAL, Patchouli, Inline, JEI
    maven { url = 'https://maven.blamejared.com' }
    // Curios, Caelus
    maven { url = 'https://maven.theillusivec4.top/' }
    // Architectury API
    maven { url = 'https://maven.architectury.dev/' }
    // EMI
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        // Pehkui
        forRepository { maven { url = 'https://jitpack.io' } }
        filter { includeGroup 'com.github.Virtuoel' }
    }
}

neoForge {
    version = project.neoforgeVersion

    // Picks up src/main/resources/META-INF/accesstransformer.cfg automatically.

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modID
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modID
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.modID
        }
        // Generates models, blockstates, recipes, tags, loot tables, advancements and NeoForge-specific data.
        data {
            data()
            gameDirectory = file('run/data')
            programArguments.addAll '--mod', project.modID, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    // Upstream's tests are plain JUnit tests that only need Minecraft classes on the classpath.
    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.gametest)

    mods {
        "${project.modID}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }
}

configurations {
    // Mods present only in dev runs; not exposed as dependencies of the published artifact.
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // === MANDATORY ===
    implementation("thedarkcolour:kotlinforforge-neoforge:${kotlinForForgeVersion}") {
        exclude group: 'net.neoforged.fancymodloader', module: 'loader'
    }
    implementation "maven.modrinth:paucal:${paucalVersion}"
    implementation "vazkii.patchouli:Patchouli:${patchouliVersion}"
    implementation "com.illusivesoulworks.caelus:caelus-neoforge:${caelusVersion}"
    implementation "com.samsthenerd.inline:inline-neoforge:${inlineVersion}"
    // Required at runtime by PAUCAL and Inline respectively
    localRuntime "dev.architectury:architectury-neoforge:${architecturyVersion}"
    localRuntime "maven.modrinth:cloth-config:${clothConfigVersion}"

    // === OPTIONAL ===
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curiosVersion}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curiosVersion}"

    compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${jeiVersion}"
    localRuntime "mezz.jei:jei-${minecraftVersion}-neoforge:${jeiVersion}"

    compileOnly "dev.emi:emi-neoforge:${emiVersion}:api"

    compileOnly("com.github.Virtuoel:Pehkui:${pehkuiVersion}") { transitive = false }

    // === OTHER ===
    compileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
    implementation 'com.google.code.findbugs:jsr305:3.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly "org.jetbrains:annotations:${jetbrainsAnnotationsVersion}"
}

test {
    useJUnitPlatform()
    // The tests use DummyXplatAbstractions (src/test/resources); keep the NeoForge service
    // registrations from the main resources off the test classpath so the ServiceLoader finds only one.
    classpath = classpath.filter { it != sourceSets.main.output.resourcesDir }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
}

// neoforge.mods.toml is generated from src/main/templates with values from gradle.properties.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
            mod_id                       : project.modID,
            mod_name                     : project.modName,
            mod_version                  : project.version,
            mod_license                  : project.modLicense,
            minecraft_version_range      : project.minecraftVersionRange,
            neoforge_version_range       : project.neoforgeVersionRange,
            kotlinforforge_version_range : project.kotlinForForgeVersionRange,
            paucal_version_range         : project.paucalVersionRange,
            patchouli_version_range      : project.patchouliVersionRange,
            caelus_version_range         : project.caelusVersionRange,
            inline_version_range         : project.inlineVersionRange,
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    def buildProps = [modVersion: project.version, modID: project.modID]
    inputs.properties buildProps
    filesMatching('pack.mcmeta') {
        expand buildProps
    }

    // json5 sources (lang files, sounds) are converted to plain json, as upstream's PKJson5 plugin did.
    filesMatching(['assets/**/*.flatten.json5', 'data/**/*.flatten.json5']) {
        path = path.replace('.flatten.json5', '.json')
        filter(Json5Filter.Flattening)
    }
    filesMatching(['assets/**/*.json5', 'data/**/*.json5']) {
        if (path.endsWith('.json5')) {
            path = path.replace('.json5', '.json')
            filter(Json5Filter.Plain)
        }
    }

    from('LICENSE.txt') { into 'META-INF' }
    from('NOTICE.md') { into 'META-INF' }
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    // Keep the suggested release name: hexcasting-reborn-by-magetka-1.21.1.jar
    archiveVersion = ''
    manifest {
        attributes([
                'Specification-Title'     : project.modID,
                'Specification-Vendor'    : 'gamma-delta / petrak@',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'Hex Casting (Reborn by Magetka)',
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'Magetka (NeoForge 1.21.1 port)',
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
