<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:"DejaVu Sans",sans-serif;
 background:radial-gradient(900px 600px at 0% 0%,#4a1636 0%,transparent 60%),radial-gradient(900px 700px at 100% 100%,#103a72 0%,transparent 60%),linear-gradient(135deg,#311a3c 0%,#28284f 50%,#1a3264 100%);position:relative;color:#f2f4ff}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(700px 420px at 35% 50%,#000 30%,transparent 80%)}
.globe{position:absolute;left:120px;top:90px;width:460px;height:460px;opacity:.35}
.glow{position:absolute;left:180px;top:150px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.55) 0%,rgba(124,92,255,.18) 45%,transparent 70%);filter:blur(8px)}
.shield{position:absolute;left:200px;top:160px;width:300px;height:320px;filter:drop-shadow(0 0 28px rgba(124,92,255,.75)) drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.txt{position:absolute;left:585px;top:205px}
h1{font-size:104px;font-weight:800;letter-spacing:-2px;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.35)}
h1 span{background:linear-gradient(90deg,#8fd8ff,#4c8dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:22px;font-size:44px;color:#b3bde6;letter-spacing:.3px}
.pills{margin-top:34px;display:flex;gap:14px}
.pill{font-size:22px;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#e3e8ff;font-family:"Noto Color Emoji","DejaVu Sans",sans-serif}
.dot{position:absolute;border-radius:50%;background:#8fd8ff;box-shadow:0 0 10px #8fd8ff}
</style></head><body>
<div class="grid"></div>
<svg class="globe" viewBox="0 0 200 200" fill="none" stroke="#9fb4ff" stroke-width=".7">
 <circle cx="100" cy="100" r="96"/><ellipse cx="100" cy="100" rx="96" ry="34"/><ellipse cx="100" cy="100" rx="96" ry="66"/>
 <ellipse cx="100" cy="100" rx="34" ry="96"/><ellipse cx="100" cy="100" rx="66" ry="96"/><line x1="4" y1="100" x2="196" y2="100"/><line x1="100" y1="4" x2="100" y2="196"/></svg>
<div class="glow"></div>
<svg class="shield" viewBox="0 0 64 68"><path d="M32 2 58 11v22C58 49 47 60 32 66 17 60 6 49 6 33V11L32 2Z" fill="#7C5CFF"/>
 <path d="M32 8.5 52 15.5v17.8c0 11.8-8.2 20.5-20 25-11.8-4.5-20-13.2-20-25V15.5L32 8.5Z" fill="#22D3EE"/>
 <path d="M21.5 34l7.5 7.5L44 25.5" fill="none" stroke="#0A1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="dot" style="left:150px;top:190px;width:6px;height:6px"></div><div class="dot" style="left:540px;top:150px;width:5px;height:5px;opacity:.7"></div>
<div class="dot" style="left:470px;top:520px;width:7px;height:7px;opacity:.8"></div><div class="dot" style="left:1180px;top:110px;width:4px;height:4px;opacity:.6"></div>
<div class="dot" style="left:1120px;top:540px;width:5px;height:5px;opacity:.5"></div>
<div class="txt"><h1>Spiritt<span>VPN</span></h1><div class="tag">Твоя свобода в сети</div>
<div class="pills"><div class="pill">⚡ Быстро</div><div class="pill">🔒 Надёжно</div><div class="pill">📱 Все устройства</div></div></div>
</body></html>
