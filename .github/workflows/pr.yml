# Build, test and runtime-check Hex Casting (Reborn by Magetka) for NeoForge 1.21.1.

name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: GameTests (dedicated server)
        run: ./gradlew runGameTestServer

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hexcasting-reborn-by-magetka-1.21.1
          path: build/libs/hexcasting-reborn-by-magetka-1.21.1.jar
          retention-days: 30

  datagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run datagen
        run: |
          chmod +x gradlew
          ./gradlew runData
      - name: Check generated data is up to date
        run: |
          git add --intent-to-add .
          git diff --name-only --exit-code -- src/generated ":!:src/generated/resources/.cache/*"

  # Launch a real client / dedicated server with the release jar and the public dependency jars.
  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        env: [server, client]
    runs-on: ubuntu-latest
    env:
      DEPENDENCIES: >-
        https://cdn.modrinth.com/data/ordsPcFz/versions/NrSebcsG/kotlinforforge-5.11.0-all.jar
        https://cdn.modrinth.com/data/9s6osm5g/versions/izKINKFg/cloth-config-15.0.140-neoforge.jar
        https://cdn.modrinth.com/data/TZo2wHFe/versions/zgpdzVKd/paucal-0.7.0%2Bneoforge-1.21.1.jar
        https://cdn.modrinth.com/data/fin1PX4m/versions/FhE1RJsR/inline-neoforge-1.21.1-1.2.2.jar
        https://cdn.modrinth.com/data/nU0bVIaL/versions/BIogJv2D/Patchouli-1.21.1-93-NEOFORGE.jar
        https://cdn.modrinth.com/data/lhGA9TYQ/versions/ZxYGwlk0/architectury-13.0.8-neoforge.jar
        https://cdn.modrinth.com/data/40FYwb4z/versions/KsfI4QsR/caelus-neoforge-7.0.1%2B1.21.1.jar
        https://cdn.modrinth.com/data/vvuO3ImH/versions/yohfFbgD/curios-neoforge-9.5.1%2B1.21.1.jar
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download dependencies
        run: |
          for url in $DEPENDENCIES; do
            wget -q --directory-prefix=run/mods/ "$url"
          done

      - uses: actions/download-artifact@v4
        with:
          name: hexcasting-reborn-by-magetka-1.21.1
          path: run/mods

      - name: Run MC test client
        if: matrix.env == 'client'
        timeout-minutes: 10
        uses: headlesshq/mc-runtime-test@4.5.1
        with:
          java: ${{ env.JAVA_VERSION }}
          mc: 1.21.1
          modloader: neoforge
          regex: '.*neoforge.*'
          fabric-api: none
          mc-runtime-test: neoforge

      - name: Run MC test server
        if: matrix.env == 'server'
        timeout-minutes: 10
        uses: headlesshq/mc-server-test@1.1.1
        with:
          java: ${{ env.JAVA_VERSION }}
          mc: 1.21.1
          modloader: neoforge
          fabric-api: none
